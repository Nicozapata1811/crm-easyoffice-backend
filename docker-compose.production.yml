volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  production_django_media: {}
  # Identity cards and other sensitive uploads. Mounted on the Django and
  # Celery containers only, never on nginx (Ley 21.719).
  production_django_private_media: {}

  production_redis_data: {}



services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: crm_easyoffice_production_django
    volumes:
      - production_django_media:/app/crm_easyoffice/media
      - production_django_private_media:/app/private_media
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: crm_easyoffice_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: crm_easyoffice_production_traefik
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
      - '0.0.0.0:5555:5555'

  redis:
    image: docker.io/redis:7.2

    volumes:
      - production_redis_data:/data


  # Converts the generated contracts from Word to PDF (LibreOffice). Internal
  # only: no port is published and traefik does not route to it.
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.39.0-libreoffice

  celeryworker:
    <<: *django
    image: crm_easyoffice_production_celeryworker
    depends_on:
      - postgres
      - redis
      - gotenberg
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: crm_easyoffice_production_celerybeat
    command: /start-celerybeat

  flower:
    <<: *django
    image: crm_easyoffice_production_flower
    command: /start-flower

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: crm_easyoffice_production_nginx
    depends_on:
      - django
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
