<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{% block title %}Firma electrónica{% endblock title %}</title>
    <style>
      :root {
        --rojo: #b00020;
        --borde: #d0d0d0;
        --texto: #1f1f1f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: var(--texto);
        background: #f6f6f6;
        line-height: 1.5;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px;
      }

      .tarjeta {
        background: #fff;
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 1.3rem;
        margin: 0 0 8px;
      }

      h2 {
        font-size: 1.05rem;
        margin: 0 0 8px;
      }

      label {
        display: block;
        margin: 12px 0 4px;
        font-weight: 600;
      }

      input[type=text],
      textarea {
        width: 100%;
        padding: 10px;
        font-size: 1rem;
        border: 1px solid var(--borde);
        border-radius: 6px;
      }

      button {
        margin-top: 12px;
        padding: 12px 16px;
        font-size: 1rem;
        border-radius: 6px;
        border: 0;
        background: #1f4e9c;
        color: #fff;
        width: 100%;
      }

      button.secundario {
        background: #fff;
        color: var(--rojo);
        border: 1px solid var(--rojo);
      }

      .error {
        color: var(--rojo);
        font-weight: 600;
      }

      .ok {
        color: #1b6e2a;
        font-weight: 600;
      }

      .pdf {
        width: 100%;
        height: 60vh;
        border: 1px solid var(--borde);
        border-radius: 6px;
      }

      @media (max-width: 600px) {
        .pdf {
          height: 35vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      {% block content %}
      {% endblock content %}
    </main>
  </body>
</html>
