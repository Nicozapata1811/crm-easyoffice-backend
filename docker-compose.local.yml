volumes:
  crm_easyoffice_local_postgres_data: {}
  crm_easyoffice_local_postgres_data_backups: {}
  crm_easyoffice_local_redis_data: {}
  crm_easyoffice_local_firma_sandbox_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: crm_easyoffice_local_django
    container_name: crm_easyoffice_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
      - path: ./.envs/.local/.firma
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: crm_easyoffice_production_postgres
    container_name: crm_easyoffice_local_postgres
    volumes:
      - crm_easyoffice_local_postgres_data:/var/lib/postgresql/data
      - crm_easyoffice_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: crm_easyoffice_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:7.2
    container_name: crm_easyoffice_local_redis
    volumes:
      - crm_easyoffice_local_redis_data:/data

  # Converts the generated contracts from Word to PDF (LibreOffice). Reached
  # only by the Celery worker on the compose network; no published port.
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.37.0-libreoffice
    container_name: crm_easyoffice_local_gotenberg

  celeryworker:
    <<: *django
    image: crm_easyoffice_local_celeryworker
    container_name: crm_easyoffice_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
      - gotenberg
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: crm_easyoffice_local_celerybeat
    container_name: crm_easyoffice_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: crm_easyoffice_local_flower
    container_name: crm_easyoffice_local_flower
    ports:
      - '5555:5555'
    command: /start-flower

  # Public HTTPS URL for Klap's webhooks. It changes on every start; the
  # backend reads it from /quicktunnel (PAYMENT_TUNNEL_METRICS_URL). Quick
  # tunnels expire after a day or two, so the script exits when the tunnel
  # loses its connection and Docker starts it again with a new one.
  tunnel:
    build:
      context: ./compose/local/tunnel
    image: crm_easyoffice_local_tunnel
    container_name: crm_easyoffice_local_tunnel
    restart: unless-stopped
    depends_on:
      - django
    command: ["http://django:8000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://localhost:2000/ready"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 20s

  # The test PSC (PSC de pruebas): a fictitious advanced-signature provider for
  # development, with its own test CA. Its signatures have no legal validity
  # and it is not in docker-compose.production.yml. It starts with the rest
  # of the stack; it needs .envs/.local/.firma (see .envs.example), and
  # without it the service refuses to start.
  # The port serves only the signing pages and the PKI downloads to the
  # browser; its API answers only on the compose network (firma-sandbox:8100).
  firma-sandbox: &firma-sandbox
    build:
      context: .
      dockerfile: ./compose/local/firma_sandbox/Dockerfile
    image: crm_easyoffice_local_firma_sandbox
    container_name: crm_easyoffice_local_firma_sandbox
    depends_on:
      - mailpit
    volumes:
      - ./firma_sandbox:/app:z
      - crm_easyoffice_local_firma_sandbox_data:/data
    environment:
      FIRMA_SANDBOX_DATA_DIR: /data
      FIRMA_SANDBOX_PKI_DIR: /app/.pki
    env_file:
      - path: ./.envs/.local/.firma
        required: false
    ports:
      - '127.0.0.1:8100:8100'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/pki/raiz.crt', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: /start

  firma-sandbox-worker:
    <<: *firma-sandbox
    container_name: crm_easyoffice_local_firma_sandbox_worker
    depends_on:
      firma-sandbox:
        condition: service_healthy
    ports: []
    healthcheck:
      disable: true
    command: /start-worker
