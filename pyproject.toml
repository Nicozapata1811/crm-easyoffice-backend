[project]
name = "crm-easyoffice"
version = "0.1.0"
description = "Web platform for client, case and document management for Easy Office"
readme = "README.md"
license = { text = "Not open source" }
authors = [
  { name = "Equipo CRM Easy Office", email = "equipo-crm-easy-office@example.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "celery==5.6.3",
  "crispy-bootstrap5==2026.9",
  "django==6.0.8",
  "django-allauth[mfa]==65.20.1",
  "django-celery-beat==2.9.0",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-redis==7.0.0",
  "djangorestframework==3.18.3",
  "docxtpl==0.20.2",
  "drf-spectacular==0.30.0",
  "flower==2.2.0",
  "gunicorn==26.2.0",
  "hiredis==3.5.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "lxml==6.1.3",
  "openpyxl==3.1.5",
  "psycopg[c]==3.3.6",
  "python-docx==1.2.0",
  "redis==8.1.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.17.0",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.2",
  "django-upgrade==1.33.0",
  "djangorestframework-stubs==3.18.1",
  "djlint==1.47.0",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.4.0",
  "pre-commit==4.7.0",
  "psycopg[c]==3.3.6",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.17.2",
  "watchfiles==1.3.0",
  "werkzeug[watchdog]==3.1.9",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
custom_blocks = "element,slot"
ignore = "H006,H030,H031"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
# The CRM and the test PSC (firma_sandbox/) share no code: they talk over HTTP.
lint.flake8-tidy-imports.banned-api.firma_sandbox.msg = "The CRM talks to the test PSC only over HTTP."
lint.flake8-tidy-imports.banned-api.psc.msg = "The CRM talks to the test PSC only over HTTP."
lint.flake8-tidy-imports.banned-api.sandbox.msg = "The CRM talks to the test PSC only over HTTP."
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true }
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
  "-m",
  "not e2e",
]
markers = [
  "e2e: end to end against the running compose stack (just e2e-firma)",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]
# The test PSC (firma_sandbox/) has its own settings and runs its own tests.
testpaths = [ "crm_easyoffice", "tests" ]

[tool.coverage]
# ==== Coverage ====
run.include = [ "crm_easyoffice/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
